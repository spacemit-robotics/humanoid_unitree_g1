        motion_length: 18.0
        observation:
          segment_0_terms: [last_action, ang_vel, dof_pos, dof_vel]
          segment_1_mode: flat_history
          segment_1_terms: [last_action, ang_vel, dof_pos, dof_vel, gravity, ref_motion_phase]
          segment_1_length: 4
          segment_1_order: newest_first
          segment_1_include_current: true
