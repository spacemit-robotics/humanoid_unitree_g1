                             15, 16, 17, 18,
                             22, 23, 24, 25]
        action_scale: 0.25
        action_blend_ratio: 1.0
        infer_decimation: 1
        rl_default_pos: [-0.1, 0.0, 0.0, 0.3, -0.2, 0.0,    # 左腿
