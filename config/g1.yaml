                                -3.0892, -0.523599, -2.618, -1.0472, -1.972222054, -1.614429558, -1.614429558,
                                -3.0892, -2.2515, -2.618, -1.0472, -1.972222054, -1.614429558, -1.614429558]
        target_position_upper: [2.8798, 2.9671, 2.7576, 2.8798, 0.5236, 0.2618,
                                2.8798, 0.5236, 2.7576, 2.8798, 0.5236, 0.2618,
                                2.618, 0.52, 0.52,
                                2.6704, 2.2515, 2.618, 2.0944, 1.972222054, 1.614429558, 1.614429558,
                                2.6704, 0.523599, 2.618, 2.0944, 1.972222054, 1.614429558, 1.614429558]
        target_limit_margin: 0.0
