                          0.35,  0.18, 0.0, 0.87, 0.0, 0.0, 0.0, # 左臂
                          0.35, -0.18, 0.0, 0.87, 0.0, 0.0, 0.0] # 右臂
        # 来源：LocoMode.yaml kps/kds + joint2motor_idx 反算到标准电机顺序
        kp: [200, 150, 150, 200, 20, 20,    # 左腿（髋俯仰/滚转/偏航、膝、踝俯仰/滚转）
             200, 150, 150, 200, 20, 20,    # 右腿
             200, 200, 200,                 # 腰
             100, 100,  50,  50, 40, 40, 40, # 左臂（肩俯仰/滚转、肘、腕）
             100, 100,  50,  50, 40, 40, 40] # 右臂
        kd: [5, 5, 5, 5, 2, 2,              # 左腿
             5, 5, 5, 5, 2, 2,              # 右腿
             5, 5, 5,                       # 腰
             2, 2, 2, 2, 2, 2, 2,           # 左臂
             2, 2, 2, 2, 2, 2, 2]           # 右臂
        observation:
          # 与 LocoMode 训练 obs 完全一致：
          # [ang_vel(3), gravity(3), cmd(3), dof_pos(29), dof_vel(29), last_action(29)] = 96
          segment_0_terms: [ang_vel, gravity, command, dof_pos, dof_vel, last_action]
          strict_dim_check: true
          ang_vel_scale: 1.0   # LocoMode 训练时未缩放
          dof_pos_scale: 1.0
          dof_vel_scale: 1.0
          dof_pos_subtract_default: true
        command:
          scale: [1.0, 1.0, 1.0]
          init: [0.0, 0.0, 0.0]   # 默认站立不移动
          limits:
            min_vx: -0.3
            max_vx: 0.7
            max_vy: 0.4
            max_wz: 1.57
        max_roll: 0.7
        max_pitch: 0.7

        # Canonical-order target bounds; physical mapping remains hardware YAML's responsibility.
        target_position_lower: [-2.5307, -0.5236, -2.7576, -0.087267, -0.87267, -0.2618,
