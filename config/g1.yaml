                          0.2,  -0.2, 0.0, 0.6,  0.0, 0.0, 0.0]   # 右臂
        # 来源：训练导出 onnx metadata joint_stiffness
        kp: [40.179, 99.098, 40.179, 99.098, 28.501, 28.501,    # 左腿
