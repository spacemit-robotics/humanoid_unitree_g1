      stand:
        display_name: 常规运控（LocoMode）
        switch_group: full_body
        policy_switch: {transition_duration: 0.5}
        # policy_29dof.pt 转换的全身站立/行走策略（LSTM，ISAACLab/RSL-RL 训练）
        # 控制 29 个关节，关节顺序为左右对称配对排列（见 action_joint_index）
        model_path: "policy/stand/stand_29dof.onnx"
        model_io:
          inputs:
            - {name: obs, source: observation}
            - {name: h_in, source: feedback, output: h_out}
            - {name: c_in, source: feedback, output: c_out}
          outputs:
            - {name: action, target: action}
        # 关节配对顺序（来自 LocoMode joint2motor_idx）：
        # 左右髋俯仰/滚转/偏航，左右膝，左右踝俯仰/滚转，腰，左右肩俯仰/滚转，左右肘，左右腕
        action_joint_index: [0,  6,  12,
                             1,  7,  13,
                             2,  8,  14,
                             3,  9,  15, 22,
                             4,  10, 16, 23,
                             5,  11, 17, 24,
                                     18, 25,
                                     19, 26,
                                     20, 27,
                                     21, 28]
        action_scale: 0.25
        action_blend_ratio: 1.0  # LocoMode 训练时直接用原始 action 作为 last_action，不做平滑
        infer_decimation: 1
        # rl_default_pos 按标准电机顺序（0-28），由 LocoMode default_angles + joint2motor_idx 反算
